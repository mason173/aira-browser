<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aira 第三方主页测试</title>
  <style>
    :root {
      color-scheme: light;
      --bg: var(--aira-page-background, #f5f7fb);
      --surface: var(--aira-surface-background, #ffffff);
      --surface-strong: var(--aira-control-background, #eef3ff);
      --text: var(--aira-text-primary, #172033);
      --muted: var(--aira-text-secondary, #697386);
      --line: var(--aira-divider, rgba(23, 32, 51, 0.1));
      --accent: var(--aira-accent, #1668e3);
      --accent-strong: #0b4fb8;
      --green: #0f8f63;
      --red: #c83e3e;
      --shadow: 0 18px 48px rgba(34, 50, 84, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "HarmonyOS Sans", "PingFang SC", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 8%, rgba(22, 104, 227, 0.14), transparent 28%),
        linear-gradient(180deg, #ffffff 0%, var(--bg) 46%, #edf4f0 100%);
    }

    body {
      padding: max(22px, env(safe-area-inset-top)) 18px max(22px, env(safe-area-inset-bottom));
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      width: min(720px, 100%);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 44px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .mark {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--green));
      box-shadow: 0 12px 26px rgba(22, 104, 227, 0.22);
      flex: 0 0 auto;
    }

    h1,
    p {
      margin: 0;
    }

    h1 {
      font-size: 20px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .sub {
      margin-top: 3px;
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status {
      min-width: 78px;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(15, 143, 99, 0.1);
      color: var(--green);
      font-size: 12px;
      text-align: center;
      white-space: nowrap;
    }

    .status.missing {
      background: rgba(200, 62, 62, 0.1);
      color: var(--red);
    }

    .search-card {
      padding: 14px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid rgba(255, 255, 255, 0.75);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .search-row {
      height: 54px;
      display: grid;
      grid-template-columns: 1fr 52px;
      gap: 10px;
    }

    .search-row input {
      width: 100%;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0 16px;
      color: var(--text);
      background: #fff;
      outline: none;
    }

    .search-row input:focus {
      border-color: rgba(22, 104, 227, 0.58);
      box-shadow: 0 0 0 4px rgba(22, 104, 227, 0.1);
    }

    .search-row button {
      border-radius: 14px;
      color: #fff;
      background: var(--accent);
      font-size: 22px;
    }

    .search-row button:active,
    .quick button:active,
    .shortcut:active {
      transform: scale(0.98);
    }

    .quick {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .quick button {
      min-height: 74px;
      border-radius: 16px;
      padding: 10px 6px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      box-shadow: 0 8px 20px rgba(34, 50, 84, 0.06);
      transition: transform 120ms ease;
    }

    .quick .icon {
      width: 28px;
      height: 28px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--accent);
      font-size: 15px;
      font-weight: 700;
    }

    .quick .label {
      max-width: 100%;
      font-size: 12px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2px;
      color: var(--muted);
      font-size: 13px;
    }

    .shortcuts {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .shortcut {
      min-width: 0;
      min-height: 98px;
      border-radius: 16px;
      padding: 12px 8px;
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: 0 8px 20px rgba(34, 50, 84, 0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 120ms ease;
    }

    .favicon {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(135deg, #1668e3, #0f8f63);
      font-size: 17px;
      font-weight: 800;
      overflow: hidden;
    }

    .favicon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .favicon.aira-home-shortcut-icon-font {
      color: var(--text);
      background: transparent;
      font-size: 24px;
    }

    .shortcut-title {
      width: 100%;
      min-height: 32px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-align: center;
      color: var(--text);
      font-size: 12px;
      line-height: 16px;
      word-break: break-word;
    }

    .empty {
      min-height: 128px;
      padding: 20px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.72);
      border: 1px dashed rgba(105, 115, 134, 0.28);
    }

    .dock {
      position: sticky;
      bottom: max(8px, env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding-top: 2px;
    }

    .dock button {
      height: 46px;
      border-radius: 14px;
      color: #fff;
      background: var(--accent-strong);
      box-shadow: 0 12px 26px rgba(11, 79, 184, 0.2);
    }

    .dock button.secondary {
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: 0 8px 20px rgba(34, 50, 84, 0.06);
    }

    @media (max-width: 420px) {
      body {
        padding-left: 14px;
        padding-right: 14px;
      }

      .quick {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 8px;
      }

      .quick button {
        min-height: 68px;
        border-radius: 14px;
      }

      .quick .icon {
        width: 26px;
        height: 26px;
      }

      .shortcuts {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }

      .shortcut {
        min-height: 90px;
        border-radius: 14px;
      }

      .favicon {
        width: 38px;
        height: 38px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">
        <div class="mark">A</div>
        <div>
          <h1>Aira Home Lab</h1>
          <p class="sub" id="subtitle">第三方 HTML 主页测试</p>
        </div>
      </div>
      <div class="status missing" id="bridgeStatus">检测中</div>
    </header>

    <section class="search-card">
      <form class="search-row" id="searchForm">
        <input id="searchInput" autocomplete="off" placeholder="搜索或输入网址">
        <button type="submit" aria-label="搜索">⌕</button>
      </form>
    </section>

    <nav class="quick" aria-label="系统入口">
      <button type="button" data-action="settings">
        <span class="icon">设</span>
        <span class="label">设置</span>
      </button>
      <button type="button" data-action="bookmarks">
        <span class="icon">书</span>
        <span class="label">书签</span>
      </button>
      <button type="button" data-action="history">
        <span class="icon">历</span>
        <span class="label">历史</span>
      </button>
      <button type="button" data-action="tabs">
        <span class="icon">签</span>
        <span class="label">标签</span>
      </button>
      <button type="button" data-action="downloads">
        <span class="icon">下</span>
        <span class="label">下载</span>
      </button>
    </nav>

    <section class="section">
      <div class="section-title">
        <span>主页快捷方式</span>
        <span id="shortcutCount">0 个</span>
      </div>
      <div class="shortcuts" id="shortcuts"></div>
      <div class="empty" id="emptyState">这里会显示从 Aira 读取到的主页快捷方式。</div>
    </section>

    <div class="dock">
      <button type="button" class="secondary" id="openAira">打开 Aira 官网</button>
      <button type="button" id="searchDemo">搜索 HarmonyOS</button>
    </div>
  </main>

  <script>
    (function () {
      var shortcutsEl = document.getElementById('shortcuts');
      var emptyEl = document.getElementById('emptyState');
      var countEl = document.getElementById('shortcutCount');
      var statusEl = document.getElementById('bridgeStatus');
      var subtitleEl = document.getElementById('subtitle');
      var searchForm = document.getElementById('searchForm');
      var searchInput = document.getElementById('searchInput');

      function hasBridge() {
        return !!(window.AiraHome && typeof window.AiraHome.openSettings === 'function');
      }

      function setBridgeStatus() {
        if (hasBridge()) {
          statusEl.textContent = '已连接';
          statusEl.classList.remove('missing');
          subtitleEl.textContent = 'AiraHome API 可用';
          return;
        }
        statusEl.textContent = '离线预览';
        statusEl.classList.add('missing');
        subtitleEl.textContent = '导入 Aira 后可调用系统入口';
      }

      function fallbackOpen(url) {
        window.location.href = url;
      }

      function openAiraAction(action, value) {
        var target = 'aira://' + encodeURIComponent(action || '');
        if (value) {
          target += '?url=' + encodeURIComponent(value);
        }
        fallbackOpen(target);
      }

      function call(action, value) {
        if (!hasBridge()) {
          if (action === 'open') {
            fallbackOpen(value);
          } else if (action === 'search') {
            openAiraAction('search', value);
          } else {
            openAiraAction(action, value);
          }
          return;
        }
        if (action === 'settings') {
          window.AiraHome.openSettings();
        } else if (action === 'bookmarks') {
          window.AiraHome.openBookmarks();
        } else if (action === 'history') {
          window.AiraHome.openHistory();
        } else if (action === 'tabs') {
          window.AiraHome.openTabs();
        } else if (action === 'downloads') {
          window.AiraHome.openDownloads();
        } else if (action === 'search') {
          window.AiraHome.search(value);
        } else if (action === 'open') {
          window.AiraHome.openUrl(value);
        }
      }

      function normalizeUrlOrQuery(value) {
        var text = String(value || '').trim();
        if (!text) {
          return '';
        }
        if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(text)) {
          return text;
        }
        if (/^[\w.-]+\.[a-zA-Z]{2,}(\/.*)?$/.test(text)) {
          return 'https://' + text;
        }
        return text;
      }

      function renderShortcuts(items) {
        var list = Array.isArray(items) ? items : [];
        shortcutsEl.innerHTML = '';
        countEl.textContent = list.length + ' 个';
        emptyEl.style.display = list.length > 0 ? 'none' : 'grid';
        list.forEach(function (item) {
          var button = document.createElement('button');
          button.type = 'button';
          button.className = 'shortcut';

          var icon = document.createElement('div');
          icon.className = 'favicon';
          if (window.AiraHome && typeof window.AiraHome.renderShortcutIcon === 'function') {
            window.AiraHome.renderShortcutIcon(icon, item);
          } else if (item.icon && /^https?:|^file:|^data:/.test(item.icon)) {
            var img = document.createElement('img');
            img.src = item.icon;
            img.alt = '';
            icon.appendChild(img);
          } else {
            icon.textContent = String(item.title || item.url || '?').trim().slice(0, 1).toUpperCase() || '?';
            if (item.iconColor) {
              icon.style.background = item.iconColor;
            }
          }

          var title = document.createElement('div');
          title.className = 'shortcut-title';
          title.textContent = item.title || item.url || '未命名';

          button.appendChild(icon);
          button.appendChild(title);
          button.addEventListener('click', function () {
            call('open', item.url || '');
          });
          button.addEventListener('contextmenu', function (event) {
            event.preventDefault();
            if (window.AiraHome && typeof window.AiraHome.removeShortcut === 'function') {
              window.AiraHome.removeShortcut(item.id || '');
            }
          });
          shortcutsEl.appendChild(button);
        });
      }

      function applyThemeVariable(root, name, value) {
        var normalized = String(value || '').trim();
        if (normalized) {
          root.style.setProperty(name, normalized);
        } else {
          root.style.removeProperty(name);
        }
      }

      function applyTheme(theme) {
        var nextTheme = theme || {};
        var palette = nextTheme.palette || {};
        var colors = palette.colors || {};
        var root = document.documentElement;
        root.dataset.airaTheme = nextTheme.effectiveMode === 'dark' ? 'dark' : 'light';
        root.dataset.themePalette = String(palette.id || '');
        applyThemeVariable(root, '--aira-accent', colors.accent);
        applyThemeVariable(root, '--aira-on-accent', colors.onAccent);
        applyThemeVariable(root, '--aira-page-background', colors.pageBackground);
        applyThemeVariable(root, '--aira-surface-background', colors.surfaceBackground);
        applyThemeVariable(root, '--aira-control-background', colors.controlBackground);
        applyThemeVariable(root, '--aira-text-primary', colors.textPrimary);
        applyThemeVariable(root, '--aira-text-secondary', colors.textSecondary);
        applyThemeVariable(root, '--aira-divider', colors.divider);
        applyThemeVariable(root, '--aira-outline', colors.outline);
      }

      function loadShortcuts() {
        setBridgeStatus();
        if (!hasBridge() || typeof window.AiraHome.getShortcuts !== 'function') {
          renderShortcuts([]);
          return;
        }
        window.AiraHome.getShortcuts().then(renderShortcuts).catch(function () {
          renderShortcuts([]);
        });
      }

      document.querySelectorAll('[data-action]').forEach(function (button) {
        button.addEventListener('click', function () {
          call(button.getAttribute('data-action'), '');
        });
      });

      searchForm.addEventListener('submit', function (event) {
        event.preventDefault();
        var value = normalizeUrlOrQuery(searchInput.value);
        if (value) {
          call('search', value);
        }
      });

      document.getElementById('openAira').addEventListener('click', function () {
        call('open', 'https://aira-tab.com');
      });

      document.getElementById('searchDemo').addEventListener('click', function () {
        searchInput.value = 'HarmonyOS NEXT ArkWeb';
        call('search', searchInput.value);
      });

      window.addEventListener('aira-home-shortcuts-changed', function (event) {
        renderShortcuts(event.detail || []);
      });

      window.addEventListener('aira-home-theme-changed', function (event) {
        applyTheme(event.detail || {});
      });

      setBridgeStatus();
      loadShortcuts();
      if (window.AiraHome && typeof window.AiraHome.getTheme === 'function') {
        window.AiraHome.getTheme().then(applyTheme).catch(function () {});
      }
      setTimeout(loadShortcuts, 350);
      setTimeout(loadShortcuts, 1000);
      setTimeout(loadShortcuts, 2000);
    })();
  </script>
</body>
</html>
