<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 172 340" width="172" height="340" fill="none">
  <!--
    搜索导航主页卡片缩略图：经典主页内容（收藏网格 + 最近关闭列表）+ 底部搜索导航停靠栏。
    与经典主页卡片同一套中性色：
      #6B7686 = 语义上的“墨色”（标题、文字占位）
      #9AA6B8 = 语义上的“块面”（图标、列表项、停靠栏）
    比例参照真实主页（390 : 844 ≈ 172 : 340）。
  -->
  <g fill="#6B7686">
    <rect x="14" y="50" width="34" height="7" rx="3.5" fill-opacity="0.42"/>
    <rect x="14" y="194" width="44" height="7" rx="3.5" fill-opacity="0.42"/>
    <rect x="44" y="213" width="62" height="6" rx="3" fill-opacity="0.3"/>
    <rect x="44" y="223" width="40" height="5" rx="2.5" fill-opacity="0.2"/>
    <rect x="44" y="241" width="52" height="6" rx="3" fill-opacity="0.3"/>
    <rect x="44" y="251" width="32" height="5" rx="2.5" fill-opacity="0.2"/>
  </g>

  <g fill="#9AA6B8">
    <!-- 收藏图标：圆角方块，与站点图标的默认圆角一致 -->
    <rect x="14" y="68" width="30" height="30" rx="9" fill-opacity="0.2"/>
    <rect x="52" y="68" width="30" height="30" rx="9" fill-opacity="0.2"/>
    <rect x="90" y="68" width="30" height="30" rx="9" fill-opacity="0.2"/>
    <rect x="128" y="68" width="30" height="30" rx="9" fill-opacity="0.2"/>
    <rect x="14" y="106" width="30" height="30" rx="9" fill-opacity="0.2"/>
    <rect x="52" y="106" width="30" height="30" rx="9" fill-opacity="0.2"/>
    <rect x="90" y="106" width="30" height="30" rx="9" fill-opacity="0.2"/>
    <rect x="128" y="106" width="30" height="30" rx="9" fill-opacity="0.2"/>
    <rect x="14" y="144" width="30" height="30" rx="9" fill-opacity="0.2"/>
    <rect x="52" y="144" width="30" height="30" rx="9" fill-opacity="0.2"/>
    <rect x="90" y="144" width="30" height="30" rx="9" fill-opacity="0.2"/>
    <rect x="128" y="144" width="30" height="30" rx="9" fill-opacity="0.2"/>

    <!-- 最近关闭记录项 -->
    <rect x="14" y="210" width="22" height="22" rx="7" fill-opacity="0.16"/>
    <rect x="14" y="238" width="22" height="22" rx="7" fill-opacity="0.16"/>
  </g>

  <!-- 底部搜索导航停靠栏：搜索框 + 一排导航按钮，底部贴边 -->
  <g fill="#9AA6B8">
    <rect x="12" y="252" width="148" height="34" rx="17" fill-opacity="0.08"/>
    <!-- 搜索框 -->
    <rect x="22" y="258" width="128" height="20" rx="10" fill-opacity="0.2"/>
    <circle cx="34" cy="268" r="4" fill-opacity="0.34"/>
    <rect x="46" y="265" width="52" height="6" rx="3" fill-opacity="0.3"/>
    <!-- 导航按钮 -->
    <circle cx="30" cy="296" r="4.5" fill-opacity="0.34"/>
    <circle cx="58" cy="296" r="4.5" fill-opacity="0.34"/>
    <circle cx="86" cy="296" r="4.5" fill-opacity="0.34"/>
    <rect x="107" y="291" width="10" height="10" rx="2.5" fill-opacity="0.3"/>
    <circle cx="142" cy="296" r="4.5" fill-opacity="0.34"/>
  </g>
</svg>
