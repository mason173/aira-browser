<!doctype html>
<!-- Aira H5 prototype: three ways to open the same webpage sharing actions from the bottom toolbar. -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Aira · 分享网页交互原型</title>
<style>
  :root {
    --ink: #172826;
    --quiet: #516460;
    --accent: #0a59f7;
    --paper: #f1f4ef;
    --stroke: #dce3dc;
    --body-font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); background: var(--paper); font: 15px/1.5 var(--body-font); }
  button, input { font: inherit; }
  button { color: inherit; cursor: pointer; }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  button, a { -webkit-tap-highlight-color: transparent; }
  .layout {
    width: min(980px, 100%); min-height: 100svh; margin: auto;
    display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: clamp(50px, 8vw, 110px);
    align-items: center; padding: 38px 24px 96px;
  }
  .intro { padding-bottom: 27px; }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 720; }
  .brand img { display: block; border-radius: 10px; width: 30px; height: 30px; }
  .brand small { border-left: 1px solid #bac8bf; padding-left: 10px; color: var(--quiet); font-size: 13px; font-weight: 500; }
  h1 { margin: 19px 0 11px; font-weight: 740; font-size: clamp(42px, 6.1vw, 76px); line-height: 1.07; letter-spacing: -.07em; }
  .intro > p { margin: 0; color: var(--quiet); font-size: 15px; }
  .variants { display: grid; gap: 0; margin-top: 38px; }
  .variant {
    appearance: none; width: 100%; background: transparent; border: 0;
    border-top: 1px solid var(--stroke); display: grid; grid-template-columns: 25px 1fr 22px;
    align-items: center; gap: 12px; text-align: left; padding: 12px 7px;
  }
  .variant:last-child { border-bottom: 1px solid var(--stroke); }
  .variant:hover { background: #e8efea; }
  .variant[aria-pressed="true"] { color: #163d31; background: #e4ede6; }
  .letter { color: var(--quiet); font: 600 13px/1 ui-monospace, Menlo, monospace; text-align: center; }
  .variant-name { display: block; font-size: 15px; font-weight: 680; }
  .variant-detail { display: block; color: var(--quiet); margin-top: 1px; font-size: 12px; }
  .variant .icon { opacity: .42; }
  .variant[aria-pressed="true"] .icon { opacity: 1; }
  .demo { min-width: 0; }
  .phone {
    isolation: isolate; position: relative; overflow: hidden; height: clamp(500px, calc(100svh - 134px), 678px);
    border: 6px solid #263630; border-radius: 40px; background: #fff; color: #182027;
    box-shadow: 0 20px 65px #253b302e, 0 2px 6px #22372924;
    --toolbar-bottom: 17px;
    --toolbar-height: 52px;
  }
  .status {
    position: absolute; z-index: 1; inset: 0 0 auto; height: 40px; background: #fff;
    display: flex; align-items: center; justify-content: space-between; padding: 0 21px;
    font-weight: 700; font-size: 12px;
  }
  .status-right { display: flex; align-items: center; gap: 8px; }
  .signal { display: flex; align-items: end; gap: 2px; height: 11px; }
  .signal i { display: block; width: 2px; border-radius: 1px; background: currentColor; }
  .signal i:nth-child(1) { height: 4px; }.signal i:nth-child(2) { height: 6px; }
  .signal i:nth-child(3) { height: 8px; }.signal i:nth-child(4) { height: 10px; }
  .battery { width: 19px; height: 9px; border-radius: 3px; border: 1px solid; position: relative; }
  .battery::before { content: ""; position: absolute; inset: 1px 3px 1px 1px; background: currentColor; border-radius: 1px; }
  .battery::after { content: ""; position: absolute; right: -3px; top: 2px; width: 1px; height: 3px; background: currentColor; }
  .webpage { position: absolute; inset: 40px 0 0; overflow: hidden auto; padding-bottom: 92px; scrollbar-width: thin; }
  .site-bar {
    display: flex; align-items: center; gap: 9px; border-bottom: 1px solid #eceded;
    padding: 13px 21px; font-size: 13px; font-weight: 640;
  }
  .site-bar .icon, .page-mark { color: #1d5c54; background: #e6f2ec; border-radius: 10px; }
  .site-bar .icon { width: 26px; height: 26px; }
  .article { padding: 24px 21px 22px; }
  .article h2 { margin: 0 0 12px; font-size: 31px; font-weight: 750; letter-spacing: -.055em; }
  .article p { font-size: 13px; line-height: 1.75; margin: 14px 0; color: #4b5c5b; }
  .article .article-deck { margin: 0 0 21px; }
  .coast {
    height: clamp(130px, 25vh, 223px); overflow: hidden; border-radius: 12px;
    background:
      radial-gradient(ellipse at 78% 22%, #f4db9f 0 9%, transparent 9.3%),
      linear-gradient(166deg, transparent 50%, #668c81 50.2% 59%, #426f6e 59.3% 63%, transparent 63.3%),
      linear-gradient(189deg, transparent 54%, #648f97 54.2% 63%, #377075 63.2% 68%, #285658 68.2%),
      linear-gradient(#b4d4cf, #dfe8cf 56%, #83b1ad 57%, #508385);
  }
  .toolbar {
    position: absolute; z-index: 2; inset: auto 10px var(--toolbar-bottom);
    height: var(--toolbar-height); display: flex; gap: 6px; align-items: center; padding: 6px;
    background: #f3f5f9ed; backdrop-filter: blur(14px); border: 1px solid #e2e6ed;
    border-radius: 29px; box-shadow: 0 3px 16px #16243c1c;
  }
  .nav-item, .share-trigger, .icon-button {
    display: inline-grid; place-items: center; border: 0; background: transparent; border-radius: 50%;
    width: 40px; height: 40px; flex: 0 0 auto;
  }
  .nav-item { width: 34px; }
  .tab-count { display: grid; place-items: center; width: 17px; height: 17px; border: 1.5px solid; border-radius: 5px; font-size: 10px; font-weight: 650; }
  .address {
    min-width: 0; flex: 1; display: flex; align-items: center; gap: 6px;
    height: 36px; padding-inline: 10px; border-radius: 20px; background: #fff;
    font-size: 12px; font-weight: 600; white-space: nowrap;
  }
  .address .refresh { margin-left: auto; }
  .share-trigger { color: var(--accent); background: #e3ecff; }
  .share-trigger:hover, .share-trigger[aria-expanded="true"] { color: #fff; background: var(--accent); }
  .home-line {
    position: absolute; z-index: 7; bottom: 5px; left: 50%; transform: translateX(-50%);
    width: 100px; height: 4px; border-radius: 10px; background: #283431; pointer-events: none;
  }
  .overlay { position: absolute; z-index: 4; inset: 0; pointer-events: none; }
  .overlay:empty { display: none; }
  .scrim { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #151e3447; pointer-events: auto; }
  .scrim.clear { background: transparent; }
  .panel {
    --enter: 10px;
    position: absolute; pointer-events: auto; background: #fff; border: 1px solid #e6eaf0;
    padding: 14px; box-shadow: 0 12px 40px #151e3429; outline: none;
    animation: arrive 150ms ease-out both; max-height: calc(100% - 45px); overflow: auto;
  }
  @keyframes arrive { from { opacity: 0; translate: 0 var(--enter); } to { opacity: 1; translate: 0 0; } }
  .panel.anchor {
    right: 49px; bottom: calc(var(--toolbar-bottom) + var(--toolbar-height) + 9px);
    width: 218px; border-radius: 18px; padding: 6px;
  }
  .panel.anchor::after {
    content: ""; position: absolute; right: 23px; bottom: -6px; width: 11px; height: 11px;
    rotate: 45deg; background: #fff; border-right: 1px solid #e6eaf0; border-bottom: 1px solid #e6eaf0;
  }
  .panel.anchor { overflow: visible; }
  .panel.sheet {
    --enter: 26px;
    inset: auto 0 0; border-radius: 25px 25px 0 0; padding: 10px 15px 23px;
  }
  .panel.center {
    left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(332px, calc(100% - 26px));
    border-radius: 24px; padding: 15px; box-shadow: 0 15px 44px #151e3440;
  }
  .panel-head { display: flex; align-items: center; gap: 8px; margin: 0 0 9px; }
  .panel-head h2 { margin: 0; font-size: 18px; letter-spacing: -.035em; flex: 1; font-weight: 730; }
  .panel-head .icon-button { width: 35px; height: 35px; background: #f0f2f5; color: #47505b; }
  .panel-head .icon-button:hover { background: #e5e9ef; }
  .grab { display: grid; place-items: center; margin: -5px auto 3px; border: 0; width: 72px; height: 14px; border-radius: 12px; background: transparent; touch-action: none; }
  .grab::before { content: ""; width: 32px; height: 4px; border-radius: 10px; background: #bdc5cd; }
  .page-preview { display: flex; align-items: center; gap: 10px; background: #f3f5f8; padding: 10px; border-radius: 13px; min-width: 0; }
  .page-preview > div { min-width: 0; }
  .page-mark { display: inline-grid; place-items: center; width: 35px; height: 35px; flex: 0 0 auto; }
  .page-title, .page-url { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .page-title { font-size: 13px; font-weight: 680; line-height: 1.35; }
  .page-url { color: #596473; font-size: 11px; margin-top: 2px; font-family: ui-monospace, Menlo, monospace; }
  .row {
    display: grid; grid-template-columns: 26px 1fr 14px; align-items: center; gap: 9px; width: 100%;
    border: 0; border-radius: 10px; background: transparent; text-align: left; padding: 0 10px; min-height: 44px;
    font-size: 14px; font-weight: 630;
  }
  .row:hover, .row:active { background: #eff4fd; }
  .row .end { justify-self: end; color: #7a8799; }
  .sheet .rows { margin-top: 8px; }
  .sheet .row { min-height: 52px; padding: 5px 8px; grid-template-columns: 33px 1fr 14px; }
  .row .description { display: block; color: #596473; font-size: 11px; font-weight: 450; margin-top: 1px; }
  .sheet .row > .icon:first-child { width: 32px; height: 32px; border-radius: 9px; color: var(--accent); background: #eaf0fe; }
  .panel.center.qr-first { padding: 15px 19px 6px; }
  .qr-first .panel-head .icon-button { background: transparent; }
  .qr-first .panel-head .icon-button:hover { background: #f0f2f5; }
  .share-page-meta { margin: 0 0 8px; text-align: center; }
  .qr-feature { display: block; width: min(192px, 100%); height: auto; aspect-ratio: 1; margin: 0 auto; }
  .qr-caption {
    display: flex; align-items: center; justify-content: center; flex-wrap: wrap;
    column-gap: 12px; margin: 0; color: #596473; font-size: 12px;
  }
  .qr-caption a { display: inline-flex; align-items: center; min-height: 34px; color: #154ab7; text-underline-offset: 3px; }
  .action-pair { display: grid; grid-template-columns: 1fr 1fr; margin-top: 7px; border-top: 1px solid #e6eaf0; }
  .small-action {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 44px; border: 0; background: transparent; font-size: 13px; font-weight: 630;
  }
  .small-action:hover, .small-action:active { color: var(--accent); }
  .secondary, .system-app {
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    min-height: 44px; border: 0; border-radius: 12px; background: #f0f2f6;
    font-size: 13px; font-weight: 630; text-decoration: none;
  }
  .secondary:hover, .system-app:hover { background: #e8eef9; }
  .qr-body { display: grid; justify-items: center; text-align: center; gap: 6px; }
  .qr-body img { display: block; width: min(180px, 100%); height: auto; aspect-ratio: 1; border-radius: 13px; border: 1px solid #e3e8ef; }
  .qr-body p, .system-note { color: #596473; font-size: 12px; margin: 4px 0 6px; }
  .qr-body .page-url { max-width: 100%; }
  .qr-body .secondary { color: #164cae; padding: 0 14px; margin: 4px 0; }
  .system-apps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin: 10px 0 3px; }
  .system-app { min-height: 58px; }
  .manual-url {
    width: 100%; min-height: 44px; border: 1px solid #d9e2f0; border-radius: 10px;
    padding: 0 9px; color: #172826; background: #f5f8fd; font-size: 13px;
  }
  .toast {
    position: absolute; z-index: 8; left: 50%; bottom: 80px; transform: translateX(-50%);
    max-width: calc(100% - 24px); width: max-content; color: #fff; background: #182a25;
    border-radius: 100px; padding: 8px 14px; font-size: 12px; font-weight: 580;
    box-shadow: 0 5px 20px #16292332; pointer-events: none;
  }
  .toast:empty { clip-path: inset(50%); }
  .switcher {
    position: fixed; z-index: 10; left: 50%; bottom: max(13px, env(safe-area-inset-bottom));
    transform: translateX(-50%); display: flex; align-items: center; gap: 11px; padding: 4px;
    background: #263730; color: #fff; border-radius: 100px; box-shadow: 0 4px 18px #11261a35;
  }
  .switcher-text { min-width: 116px; text-align: center; font-size: 12px; font-weight: 650; white-space: nowrap; }
  .switcher .icon-button { width: 40px; height: 40px; background: #ffffff14; }
  .switcher .icon-button:hover { background: #ffffff29; }
  .icon { display: inline-grid; grid-template: 100% / 100%; flex: 0 0 auto; place-items: center; color: inherit; width: 20px; height: 20px; }
  .icon::before { content: ""; width: 100%; height: 100%; background: currentColor; mask: var(--glyph) center / contain no-repeat; }
  .icon.tinted::before { width: 19px; height: 19px; }
  .icon.mini { width: 13px; height: 13px; }

    const open = view !== '';
    shareTrigger.setAttribute('aria-expanded', String(open));
    switcherText.textContent = `${variant} · ${variants[variant]}`;
    document.querySelectorAll('[data-variant]').forEach(button => {
      button.setAttribute('aria-pressed', String(button.dataset.variant === variant));
    });
    if (!open) {
      overlay.replaceChildren();
      return;
    }

    const renderers = { A: variantA, B: variantB, C: variantC };
    const content = view === 'choices' ? renderers[variant]() : view === 'qr' ? qrPanel() :
      view === 'system' ? systemPanel() :
      `${heading('手动复制链接', true)}<input class="manual-url" readonly value="${pageUrl}" aria-label="网页链接">`;
    overlay.innerHTML = `<button type="button" class="scrim ${layout === 'anchor' ? 'clear' : ''}"
      data-action="close" aria-label="关闭分享" tabindex="-1"></button>
      <section class="panel ${layout}" role="dialog" aria-label="${labels[view]}" tabindex="-1">${content}</section>`;
  }

  function show(nextView, moveFocus = true) {
    copyRequest++;
    view = nextView;
    render();
    if (!moveFocus) return;
    if (!view) {
      shareTrigger.focus({ preventScroll: true });
    } else if (view === 'manual') {
      const input = overlay.querySelector('input');
      input.focus({ preventScroll: true });
      input.select();
    } else {
      overlay.querySelector('.panel').focus({ preventScroll: true });
    }
  }

  function chooseVariant(key) {
    variant = key;
    const next = new URL(location.href);
    next.searchParams.set('variant', key);
    try { history.replaceState(null, '', next); } catch (_) {}
    show('choices', false);
  }

  function moveVariant(step) {
    chooseVariant(keys[(keys.indexOf(variant) + step + keys.length) % keys.length]);
  }

  function notify(text) {
    clearTimeout(toastTimer);
    toast.textContent = text;
    toastTimer = setTimeout(() => { toast.textContent = ''; }, 2200);
  }

  async function copyLink() {
    const request = ++copyRequest;
    let copied = false;
    if (navigator.clipboard?.writeText) {
      try {
        await navigator.clipboard.writeText(pageUrl);
        copied = true;
      } catch (_) {}
    } else if (typeof document.execCommand === 'function') {
      const input = document.createElement('textarea');
      input.value = pageUrl;
      input.setAttribute('readonly', '');
      input.style.cssText = 'position:fixed;left:0;top:0;opacity:0;pointer-events:none';
      document.body.append(input);
      input.select();
      try { copied = document.execCommand('copy'); } catch (_) {}
      input.remove();
    }
    if (request !== copyRequest) return;
    if (!copied) {
      show('manual');
      return;
    }
    show('');
    notify('链接已复制');
  }

  shareTrigger.addEventListener('click', () => show(view ? '' : 'choices'));
  document.querySelectorAll('[data-variant]').forEach(button =>
    button.addEventListener('click', () => chooseVariant(button.dataset.variant)));
  document.querySelectorAll('[data-step]').forEach(button =>
    button.addEventListener('click', () => moveVariant(Number(button.dataset.step))));

  overlay.addEventListener('click', event => {
    const item = event.target.closest('button');
    if (!item) return;
    if (item.dataset.target) {
      show('');
      notify(`已选择「${item.dataset.target}」（演示）`);
      return;
    }
    switch (item.dataset.action) {
      case 'copy': void copyLink(); break;
      case 'qr': show('qr'); break;
      case 'system': show('system'); break;
      case 'back': show('choices'); break;
      case 'close': show(''); break;
    }
  });

  overlay.addEventListener('pointerdown', event => {
    const handle = event.target.closest('.grab');
    if (!handle) return;
    swipeStart = event.clientY;
    handle.setPointerCapture(event.pointerId);
  });
  overlay.addEventListener('pointerup', event => {
    if (swipeStart !== undefined && event.clientY - swipeStart >= 36) show('');
    swipeStart = undefined;
  });
  overlay.addEventListener('pointercancel', () => { swipeStart = undefined; });

  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && view) {
      event.preventDefault();
      show(view === 'choices' ? '' : 'choices');
      return;
    }
    if (event.target.matches('input, textarea, [contenteditable]') || event.altKey || event.metaKey || event.ctrlKey) return;
    if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
      event.preventDefault();
      moveVariant(event.key === 'ArrowLeft' ? -1 : 1);
    }
  });

  render();
</script>
</body>
</html>
