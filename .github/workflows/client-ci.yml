name: Client CI

on:
  pull_request:
    paths-ignore:
      - 'extensions/**'
      - 'services/**'
  push:
    branches: [main]
    paths-ignore:
      - 'extensions/**'
      - 'services/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install contract-check tooling
        run: npm ci --no-audit --no-fund
      - name: Check committed patch
        shell: bash
        run: |
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check
          fi
      - name: Check open-source source tree
        run: bash scripts/check-open-source-source-tree.sh
      - name: Check architecture guards
        run: bash scripts/check-architecture-guardrails.sh
      - name: Check shortcut store hand-over
        run: bash scripts/check-aira-shortcut-store-handoff-contract.sh
      - name: Check app recommendation page
        run: bash scripts/check-aira-app-recommendation-contract.sh
      - name: Check geolocation permission flow
        run: node scripts/check-aira-geolocation-permission.cjs
      - name: Check web swipe navigation
        run: node scripts/check-aira-web-swipe-navigation.cjs
      - name: Check closed tabs stay closed after restart
        run: node scripts/check-aira-closed-tab-session-restore.cjs
      - name: Check shared HTML viewer response flow
        run: node scripts/check-aira-shared-html-viewer.cjs
      - name: Check QQ webpage login round trip
        run: node --test scripts/check-aira-qq-web-login.cjs
      - name: Check video toolbar takeover
        run: node scripts/check-aira-video-toolbar-takeover.cjs
      - name: Check video cast session
        run: node scripts/check-aira-video-cast-session.cjs
      - name: Check search style isolation
        run: node scripts/check-aira-search-style-isolation.cjs
      - name: Check search list viewport
        run: node scripts/check-aira-search-list-viewport.cjs
      - name: Check title-bar click and drag behavior
        run: node --test scripts/check-aira-window-title-drag.cjs
      - name: Check PC startup window maximization
        run: node --test scripts/check-aira-startup-window.cjs
      - name: Check bookmark-bar mouse and touch drag sorting
        run: node --test scripts/check-aira-bookmark-bar-drag.cjs
      - name: Install native download test dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Check download lifecycle, recovery, storage and native transport
        run: ./scripts/check-aira-downloads.sh
      - name: Check ad-block document-start CSS
        run: node --test scripts/check-aira-adblock-document-start.cjs
      - name: Check ad-block replacement download prevention
        run: node --test scripts/check-aira-adblock-download-response.cjs
      - name: Check ad-block discovery, popup and subscription compatibility
        run: node --test scripts/check-aira-adblock-frame-bridge.cjs scripts/check-aira-adblock-cosmetic-query.cjs scripts/check-aira-adblock-cosmetic-discovery.cjs scripts/check-aira-adblock-popup.cjs scripts/check-aira-adblock-subscriptions.cjs
      - name: Check disabled filter and user-script startup
        run: node --test scripts/check-aira-adblock-startup.cjs scripts/check-aira-userscript-startup.cjs scripts/check-aira-userscript-lazy-sessions.cjs
      - name: Check Rust ad-block matching semantics
        working-directory: AiraBrowser/entry/src/main/cpp/rust/aira_adblock_core
        run: cargo test --locked
      - name: Check icon catalog
        run: node scripts/check-aira-icon-catalog.js
      - name: Check generated icons
        run: bash scripts/check-aira-icons-generated.sh

  community:
    if: ${{ vars.AIRA_ENABLE_HARMONYOS_CLIENT_CI == 'true' }}
    runs-on: [self-hosted, macOS, harmonyos]
    env:
      AIRA_ALLOW_UNSIGNED_BUILD: "1"
      AIRA_DISTRIBUTION: community
      SKIP_INSTALL: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install Harmony dependencies
        working-directory: AiraBrowser
        run: ohpm install
      - name: Build Community HAP
        run: ./scripts/build-aira-browser.sh
      - name: Audit Community package boundary
        shell: bash
        run: |
          set -euo pipefail
          hap="AiraBrowser/entry/build/default/outputs/default/entry-default-unsigned.hap"
          audit_dir="$(mktemp -d)"
          trap 'rm -rf "${audit_dir}"' EXIT
          unzip -q "${hap}" -d "${audit_dir}"
          rg -a -q -F "org.aira.browser" "${audit_dir}"
          rg -a -q -F "https://community.invalid" "${audit_dir}"
          if rg -a -q -F "org.aira.browser.community" "${audit_dir}" ||
             rg -a -q -F "api.aira.cool" "${audit_dir}" ||
             rg -a -q -F "com.aira.browser" "${audit_dir}"; then
            echo "Community HAP contains an old or Official identity/endpoint." >&2
            exit 1
          fi
          test "$(jq -r '.app.bundleName' "${audit_dir}/module.json")" = "org.aira.browser"
          test "$(jq '.module.metadata | length' "${audit_dir}/module.json")" -eq 0
          test ! -e "${audit_dir}/resources/rawfile/agconnect-services.json"
      - uses: actions/upload-artifact@v4
        with:
          name: aira-community-${{ github.sha }}
          path: AiraBrowser/entry/build/default/outputs/default/entry-default-unsigned.hap

  official:
    if: ${{ vars.AIRA_ENABLE_HARMONYOS_CLIENT_CI == 'true' && vars.AIRA_ENABLE_SIGNED_CLIENT_CI == 'true' && github.event_name != 'pull_request' }}
    runs-on: [self-hosted, macOS, harmonyos]
    env:
      AIRA_AGCONNECT_CONFIG: ${{ secrets.AIRA_OFFICIAL_AGCONNECT_CONFIG_PATH }}
      AIRA_BUILD_PROFILE: ${{ secrets.AIRA_OFFICIAL_BUILD_PROFILE_PATH }}
      AIRA_DISTRIBUTION: official
      SKIP_INSTALL: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install Harmony dependencies
        working-directory: AiraBrowser
        run: ohpm install
      - name: Build Official HAP
        run: ./scripts/build-aira-browser.sh
      - uses: actions/upload-artifact@v4
        with:
          name: aira-official-${{ github.sha }}
          path: AiraBrowser/entry/build/default/outputs/default/entry-default-signed.hap
